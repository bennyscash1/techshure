<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>Tech-shure og image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=block" rel="stylesheet" />
<style>
  /* Brand colors, mirrored from src/styles.css */
  :root {
    --navy: #16295a;
    --navy-deep: #0e1c40;
    --blue: #2a6cc4;
    --cyan: #19c3e6;
    --cyan-soft: #d8f3f9;
    --muted: #59627a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Heebo', system-ui, sans-serif;
    color: var(--navy);
    background:
      radial-gradient(520px 420px at 50% 36%, rgba(25, 195, 230, 0.16), transparent 70%),
      radial-gradient(700px 500px at 0% 100%, rgba(42, 108, 196, 0.14), transparent 70%),
      radial-gradient(700px 500px at 100% 0%, rgba(25, 195, 230, 0.12), transparent 70%),
      linear-gradient(160deg, #ffffff 0%, #f3f8fd 55%, #e8f1fb 100%);
    position: relative;
  }
  /* Decorative swirl rings, echoing the emblem */
  .ring { position: absolute; border-radius: 50%; border: 2px solid; pointer-events: none; }
  .r1 { width: 900px; height: 900px; left: -620px; top: -150px; border-color: rgba(42, 108, 196, 0.16); }
  .r2 { width: 760px; height: 760px; left: -560px; top: -60px; border-color: rgba(25, 195, 230, 0.20); }
  .r3 { width: 900px; height: 900px; right: -620px; top: -120px; border-color: rgba(42, 108, 196, 0.16); }
  .r4 { width: 760px; height: 760px; right: -560px; top: -40px; border-color: rgba(25, 195, 230, 0.20); }

  /* Top and bottom accent bars */
  .bar { position: absolute; left: 0; right: 0; height: 10px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--blue) 50%, var(--cyan) 100%); }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; height: 6px; opacity: 0.9; }

  /* Everything important lives in the central 630x630 square */
  .core {
    position: absolute; left: 285px; top: 0; width: 630px; height: 630px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .emblem {
    width: 300px; height: 300px; display: block;
    filter: drop-shadow(0 18px 30px rgba(22, 41, 90, 0.18));
    margin-top: 6px;
  }
  .wordmark {
    direction: ltr; font-weight: 800; font-size: 84px; line-height: 1;
    letter-spacing: -1.5px; margin-top: 4px;
  }
  .wordmark .a { color: var(--navy); }
  .wordmark .b { color: var(--blue); }
  .slogan {
    font-weight: 700; font-size: 50px; line-height: 1.1; color: var(--navy-deep);
    margin-top: 14px;
  }
  .slogan .dot { color: var(--cyan); }
  .meta {
    margin-top: 18px; display: flex; align-items: center; gap: 14px;
    font-size: 24px; font-weight: 500; color: var(--muted);
  }
  .meta .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); }
  .meta .domain { direction: ltr; color: var(--blue); font-weight: 700; }

  /* Side chips, only seen in the wide preview (fine if cropped) */
  .side { position: absolute; top: 0; height: 630px; width: 285px;
    display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .side.right { right: 0; align-items: center; }
  .side.left { left: 0; align-items: center; }
  .chip {
    background: rgba(255, 255, 255, 0.85); border: 1.5px solid rgba(42, 108, 196, 0.18);
    border-radius: 999px; padding: 10px 22px; font-size: 22px; font-weight: 700; color: var(--navy);
    box-shadow: 0 1px 2px rgba(22, 41, 90, 0.06), 0 10px 24px -12px rgba(22, 41, 90, 0.25);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); display: block; }
  .chip .ltr { direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
  <div class="bar top"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="ring r3"></div><div class="ring r4"></div>

  <div class="side right">
    <div class="chip"><i></i>מענה טלפוני חכם</div>
    <div class="chip"><i></i>בוט וואטסאפ</div>
  </div>
  <div class="side left">
    <div class="chip"><i></i><span class="ltr">CRM / ERP</span></div>
    <div class="chip"><i></i>דף נחיתה</div>
  </div>

  <main class="core">
    <img class="emblem" src="../../src/assets/emblem.webp" alt="" />
    <div class="wordmark"><span class="a">Tech-</span><span class="b">shure</span></div>
    <div class="slogan">טכנולוגיה<span class="dot">.</span> על בטוח<span class="dot">.</span></div>
    <div class="meta"><span class="domain">tech-shure.dev</span></div>
  </main>

  <div class="bar bottom"></div>
</body>
</html>
